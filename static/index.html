<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#4f8ef7" />
  <title>OmniNote</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    /* ── Reset & Base ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", "PingFang TC", "Hiragino Sans", sans-serif; }
    button { cursor: pointer; border: none; background: none; font: inherit; }
    input, textarea { font: inherit; }

    /* ── App Shell ────────────────────────────────────────────────────────── */
    #app { height: 100%; }
    .app { height: 100%; display: flex; flex-direction: column; background: #f5f5f7; }

    /* ── Notebook List ────────────────────────────────────────────────────── */
    .notebook-list {
      flex: 1; overflow-y: auto; padding: 24px;
      max-width: 960px; margin: 0 auto; width: 100%;
    }
    .list-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .app-title { font-size: 28px; font-weight: 700; color: #1a1a2e; }
    .btn-primary {
      background: #4f8ef7; color: #fff; border-radius: 10px;
      padding: 9px 18px; font-size: 14px; font-weight: 600;
      transition: background .15s;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary {
      background: #e5e7eb; color: #374151; border-radius: 10px;
      padding: 9px 18px; font-size: 14px; font-weight: 600;
    }
    .create-form {
      background: #fff; border-radius: 14px; padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .input-field {
      border: 1.5px solid #d1d5db; border-radius: 8px;
      padding: 10px 14px; font-size: 15px; outline: none; width: 100%;
      transition: border-color .15s;
    }
    .input-field:focus { border-color: #4f8ef7; }
    .form-actions { display: flex; gap: 10px; }
    .empty-state {
      text-align: center; padding: 80px 20px; color: #9ca3af;
    }
    .empty-icon { font-size: 64px; margin-bottom: 16px; }
    .notebooks-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px;
    }
    .notebook-card {
      background: #fff; border-radius: 14px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      transition: transform .15s, box-shadow .15s;
    }
    .notebook-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
    .card-body { padding: 18px 18px 8px; cursor: pointer; }
    .card-title { font-size: 16px; font-weight: 600; color: #1a1a2e; margin-bottom: 8px; }
    .card-meta { display: flex; gap: 6px; font-size: 12px; color: #9ca3af; }
    .card-actions {
      display: flex; justify-content: flex-end; gap: 4px;
      padding: 8px 12px 12px; border-top: 1px solid #f3f4f6;
    }
    .icon-btn {
      width: 32px; height: 32px; padding: 0;
      border-radius: 6px; font-size: 13px;
      color: #4b5563; background: transparent;
      border: 1px solid #e5e7eb;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s, color .15s;
    }
    .icon-btn:hover {
      background: #f9fafb; border-color: #d1d5db; color: #1f2937;
    }
    .icon-btn.danger:hover { background: #fff1f2; border-color: #fecdd3; color: #dc2626; }

    /* ── Editor Layout ────────────────────────────────────────────────────── */
    .app.editor { display: flex; flex-direction: column; }
    .top-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 0 10px; min-height: 48px; background: #fff;
      border-bottom: 1px solid #e5e7eb; flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
      overflow: visible;
    }
    .top-bar-leading {
      display: flex; align-items: center; gap: 8px;
      min-width: 0; flex: 0 1 auto;
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: #2563eb; font-size: 13px; font-weight: 600;
      padding: 4px 8px; border-radius: 6px; transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .btn-back:hover { background: #eff6ff; }
    .btn-back-icon { flex-shrink: 0; }
    .btn-back-label { white-space: nowrap; }
    .notebook-title {
      flex: 0 1 200px; font-size: 15px; font-weight: 600;
      color: #1a1a2e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .top-bar-tools {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
    }
    .top-bar-actions {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .save-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 32px;
      padding: 0;
    }
    .save-status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 0 0 3px rgba(209,213,219,.85);
    }
    .save-status-dot.saving { background: #f59e0b; }
    .save-status-dot.saved  { background: #10b981; }

    /* ── Export menu ──────────────────────────────────────────────────────── */
    /* ── Background picker ────────────────────────────────────────────────── */
    .bg-menu-wrap { position: relative; }
    .bg-dropdown {
      position: absolute; right: 0; top: calc(100% + 6px);
      background: #fff; border-radius: 14px; padding: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.14); z-index: 150;
      min-width: 220px; display: flex; flex-direction: column; gap: 10px;
    }
    .bg-section-label { font-size: 11px; font-weight: 600; color: #9ca3af; }
    .bg-type-row { display: flex; gap: 4px; }
    .bg-type-btn {
      flex: 1; padding: 6px 4px; font-size: 12px; font-weight: 600;
      border-radius: 8px; border: 1.5px solid #e5e7eb;
      color: #374151; background: #f9fafb; transition: all .12s;
    }
    .bg-type-btn:hover { background: #f3f4f6; border-color: #d1d5db; }
    .bg-type-btn.active { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
    .bg-sliders { display: flex; flex-direction: column; gap: 8px; }
    .bg-slider-row {
      display: flex; align-items: center; gap: 8px;
    }
    .bg-slider-label { font-size: 11px; color: #6b7280; width: 40px; flex-shrink: 0; }
    .bg-slider-row input[type=range] { flex: 1; }
    .bg-slider-value { font-size: 11px; color: #374151; width: 36px; text-align: right; flex-shrink: 0; }
    .bg-divider { height: 1px; background: #f3f4f6; margin: 2px 0; }
    .bg-upload-btn {
      width: 100%; padding: 8px; font-size: 13px; font-weight: 600;
      border-radius: 8px; border: 1.5px dashed #d1d5db;
      color: #4b5563; background: #f9fafb; transition: all .12s;
    }
    .bg-upload-btn:hover { background: #f3f4f6; border-color: #9ca3af; }
    .bg-remove-btn {
      width: 100%; padding: 7px; font-size: 12px; font-weight: 600;
      border-radius: 8px; color: #dc2626; background: #fff1f2;
      border: 1px solid #fecdd3; transition: background .12s;
    }
    .bg-remove-btn:hover { background: #fee2e2; }

    .export-menu-wrap { position: relative; }
    .btn-export {
      background: #f3f4f6; color: #374151; border-radius: 8px;
      padding: 7px 14px; font-size: 13px; font-weight: 600;
      transition: background .15s; white-space: nowrap;
    }
    .btn-export:hover:not(:disabled) { background: #e5e7eb; }
    .btn-export:disabled { opacity: .6; cursor: not-allowed; }
    .export-backdrop {
      position: fixed; inset: 0; z-index: 149;
    }
    .export-dropdown {
      position: absolute; right: 0; top: calc(100% + 6px);
      background: #fff; border-radius: 12px; padding: 6px;
      box-shadow: 0 8px 28px rgba(0,0,0,.14); z-index: 150;
      min-width: 220px;
    }
    .export-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%; text-align: left; padding: 10px 12px;
      border-radius: 8px; transition: background .12s;
    }
    .export-item:hover { background: #f3f4f6; }
    .export-icon { font-size: 22px; flex-shrink: 0; }
    .export-label { font-size: 14px; font-weight: 600; color: #1a1a2e; }
    .export-hint  { font-size: 11px; color: #9ca3af; margin-top: 1px; }
    .export-bg-toggle {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; cursor: pointer;
      font-size: 13px; color: #374151; user-select: none;
    }
    .export-bg-toggle input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: #6366f1; }
    .export-divider { height: 1px; background: #e5e7eb; margin: 4px 8px; }

    /* ── Cloud buttons ─────────────────────────────────────────────────────── */
    .cloud-btn-group { display: flex; gap: 2px; align-items: center; }
    .icon-btn.cloud-active { color: #6366f1; }
    .cloud-dot {
      position: absolute; top: 4px; right: 4px;
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e; border: 1.5px solid #fff;
    }
    .icon-btn { position: relative; }

    /* ── Cloud modals ──────────────────────────────────────────────────────── */
    .cloud-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
    }
    .cloud-modal {
      background: #fff; border-radius: 16px;
      padding: 24px; width: 420px; max-width: 95vw;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .cloud-conflict-modal { width: 680px; }
    .cloud-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .cloud-modal-title { font-size: 17px; font-weight: 700; color: #1a1a2e; }
    .cloud-modal-close {
      background: none; border: none; font-size: 18px; cursor: pointer;
      color: #9ca3af; padding: 4px 8px; border-radius: 6px;
    }
    .cloud-modal-close:hover { background: #f3f4f6; color: #374151; }
    .cloud-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .cloud-field span { font-size: 13px; font-weight: 600; color: #374151; }
    .cloud-input {
      border: 1.5px solid #e5e7eb; border-radius: 8px;
      padding: 9px 12px; font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    .cloud-input:focus { border-color: #6366f1; }
    .cloud-error { font-size: 13px; color: #ef4444; margin: -6px 0 10px; }
    .cloud-modal-footer {
      display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;
    }
    .cloud-btn-primary {
      background: #6366f1; color: #fff; border: none;
      border-radius: 8px; padding: 9px 20px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .cloud-btn-primary:hover:not(:disabled) { background: #4f46e5; }
    .cloud-btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .cloud-btn-cancel {
      background: #f3f4f6; color: #374151; border: none;
      border-radius: 8px; padding: 9px 20px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .cloud-btn-cancel:hover { background: #e5e7eb; }
    .cloud-section-label { font-size: 12px; font-weight: 600; color: #9ca3af; text-transform: uppercase; margin-bottom: 8px; }
    .cloud-recent-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 8px; transition: background .12s;
    }
    .cloud-recent-row:hover { background: #f9fafb; }
    .cloud-recent-info { display: flex; flex-direction: column; gap: 2px; }
    .cloud-recent-name { font-size: 14px; font-weight: 600; color: #1a1a2e; }
    .cloud-recent-date { font-size: 12px; color: #9ca3af; }
    .cloud-recent-actions { display: flex; gap: 6px; }
    .cloud-btn-sm {
      border: none; border-radius: 6px; padding: 5px 12px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .cloud-btn-danger { background: #fee2e2; color: #ef4444; }
    .cloud-btn-danger:hover { background: #fecaca; }
    .cloud-divider { height: 1px; background: #e5e7eb; margin: 12px 0; }
    .cloud-id-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .cloud-share-box { padding: 8px 0; }
    .cloud-share-label { font-size: 14px; color: #374151; margin-bottom: 10px; }
    .cloud-share-row { display: flex; gap: 8px; }
    .cloud-share-input {
      flex: 1; border: 1.5px solid #e5e7eb; border-radius: 8px;
      padding: 8px 12px; font-size: 13px; color: #374151; background: #f9fafb;
    }
    .cloud-copy-btn {
      background: #6366f1; color: #fff; border: none; border-radius: 8px;
      padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .cloud-copy-btn:hover { background: #4f46e5; }
    .cloud-conflict-hint { font-size: 14px; color: #374151; margin-bottom: 16px; }
    .cloud-conflict-thumbs { display: flex; gap: 20px; }
    .cloud-conflict-side { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .cloud-conflict-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
    .cloud-thumb-img { width: 100%; border: 1.5px solid #e5e7eb; border-radius: 8px; }
    .cloud-thumb-placeholder {
      width: 100%; aspect-ratio: 280/396;
      background: #f3f4f6; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #9ca3af;
    }

    .editor-main {
      flex: 1; display: flex; overflow: hidden;
    }

    /* ── Canvas wrapper (positioned) ──────────────────────────────────────── */
    .canvas-wrapper {
      flex: 1; position: relative; overflow: auto;
      background: #e8eaed;
    }
    .canvas-wrapper.is-pan-mode {
      cursor: grab;
    }
    .page-stage {
      min-width: 100%; min-height: 100%;
      display: flex; justify-content: flex-start;
      align-items: flex-start;
      padding: 28px;
    }
    .page-zoom-layer {
      position: relative;
      flex: 0 0 auto;
      margin: 0 auto;
    }
    .page-content {
      position: relative;
      transform-origin: top left;
      background: #fff;
      border: 1px solid #d9dde5;
      box-shadow: 0 12px 36px rgba(16, 24, 40, .18), 0 2px 8px rgba(16, 24, 40, .08);
    }

    /* ── Toolbar ──────────────────────────────────────────────────────────── */
    .toolbar {
      display: flex; flex-direction: row; align-items: center;
      gap: 1px; padding: 0 2px;
      background: transparent;
      overflow: visible;
      height: 48px;
      width: max-content;
    }
    .tool-btn {
      width: 34px; height: 34px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: #4b5563; transition: background .12s, color .12s, border-color .12s;
      border: 1px solid transparent;
    }
    .tool-btn:hover  { background: #f9fafb; border-color: #e5e7eb; color: #1f2937; }
    .tool-btn.active { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
    .tool-btn.danger:hover { background: #fff1f2; border-color: #fecdd3; color: #dc2626; }
    .tool-divider { width: 1px; height: 22px; background: #e5e7eb; margin: 0 3px; }

    .color-swatch-btn {
      --swatch-dot-size: 18px;
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid #d1d5db;
      box-shadow: none; cursor: pointer;
      transition: transform .1s;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
    }
    .color-swatch-dot {
      width: var(--swatch-dot-size);
      height: var(--swatch-dot-size);
      border-radius: 50%;
      transition: width .15s, height .15s;
    }
    .color-swatch-btn:hover { transform: scale(1.15); }
    .color-palette {
      background: #fff; border-radius: 12px;
        padding: 10px; display: flex; flex-direction: row; flex-wrap: wrap;
        gap: 6px; max-width: 160px;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
    }
    .color-palette-overlay {
      position: fixed; z-index: 120;
    }
    .color-dot {
      width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid transparent;
      cursor: pointer; transition: transform .1s, border-color .1s;
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.selected { border-color: #1a1a2e; }

    .eraser-mode-toggle {
      font-size: 9px; font-weight: 700; border-radius: 4px;
      padding: 1px 3px; margin-left: -4px; margin-top: -2px;
      align-self: flex-end;
    }
    .mode-badge.precise { background: #dbeafe; color: #1d4ed8; }
    .mode-badge.stroke  { background: #fce7f3; color: #be185d; }

    /* ── Width swatch button (next to color swatch) ──────────────────────── */
    .width-swatch-btn {
      width: 28px; height: 28px; border-radius: 6px;
      border: 1.5px solid #d1d5db; background: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: border-color .12s, background .12s;
      flex-shrink: 0;
    }
    .width-swatch-btn:hover { background: #f9fafb; border-color: #9ca3af; }
    .width-swatch-btn.active { background: #eff6ff; border-color: #bfdbfe; }
    .width-swatch-line {
      display: block; width: 14px; border-radius: 99px;
      min-height: 2px;
    }

    /* ── Width popover (fixed overlay) ───────────────────────────────────── */
    .width-popover-overlay {
      position: fixed; z-index: 200;
      background: #fff; border-radius: 12px;
      padding: 12px 14px; min-width: 180px;
      box-shadow: 0 8px 28px rgba(0,0,0,.15);
      display: flex; flex-direction: column; gap: 8px;
    }
    .width-popover-label { font-size: 11px; color: #6b7280; font-weight: 600; }
    .width-popover-value { font-size: 12px; color: #374151; text-align: right; }
    .width-slider-wrap {
      position: relative; display: flex; align-items: center;
      justify-content: center; width: 150px; height: 32px;
    }
    .width-triangle {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 148px; height: 18px;
      background: linear-gradient(to right, #e0e0e0 0%, #9ca3af 100%);
      clip-path: polygon(0% 35%, 0% 65%, 100% 0%, 100% 100%);
      pointer-events: none;
      border-radius: 0 3px 3px 0;
      opacity: 0.55;
    }
    .width-slider-wrap input[type=range] {
      position: relative; z-index: 1;
      width: 150px; appearance: none;
      writing-mode: horizontal-tb; direction: ltr;
      height: 24px; background: transparent;
    }
    /* ── Zoom dropdown ────────────────────────────────────────────────────── */
    .zoom-menu-wrap { position: relative; }
    .zoom-dropdown {
      position: absolute; right: 0; top: calc(100% + 6px);
      background: #fff; border-radius: 12px; padding: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,.14); z-index: 150;
      min-width: 220px;
    }
    .zoom-slider-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 10px;
    }
    .zoom-slider-value {
      font-size: 18px; font-weight: 700; color: #111827;
    }
    .zoom-reset {
      padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      color: #2563eb; background: #eff6ff;
    }
    .zoom-slider {
      width: 100%;
      accent-color: #2563eb;
    }
    .zoom-slider-scale {
      display: flex; justify-content: space-between; margin-top: 8px;
      font-size: 11px; color: #6b7280;
    }

    @media (max-width: 820px) {
      .top-bar {
        flex-wrap: wrap;
        align-content: flex-start;
        padding: 8px 10px 6px;
        gap: 6px;
      }
      .top-bar-leading {
        flex: 1 1 auto;
        min-width: 0;
      }
      .btn-back-label {
        display: none;
      }
      .notebook-title {
        flex: 1 1 auto;
      }
      .top-bar-actions {
        margin-left: 0;
      }
      .top-bar-tools {
        order: 3;
        flex: 1 0 100%;
        width: 100%;
        padding-bottom: 2px;
      }
    }

    @media (max-width: 560px) {
      .top-bar-leading {
        flex: 1 1 0;
      }
      .notebook-title {
        max-width: 42vw;
      }
      .top-bar-actions {
        gap: 6px;
      }
      .zoom-dropdown {
        right: -10px;
        min-width: min(240px, calc(100vw - 20px));
      }
    }


    /* ── Page tabs ────────────────────────────────────────────────────────── */
    .page-tabs {
      display: flex; align-items: center;
      padding: 0 12px; height: 44px; background: #fff;
      border-top: 1px solid #e5e7eb; flex-shrink: 0;
      overflow: visible;
    }
    .page-tabs-scroll {
      display: flex; align-items: center; gap: 2px;
      overflow-x: auto; flex: 1;
    }
    .page-tabs-add-wrap {
      position: relative; flex-shrink: 0;
    }
    .page-tab {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 14px; border-radius: 8px 8px 0 0;
      font-size: 13px; font-weight: 500; color: #6b7280;
      cursor: pointer; white-space: nowrap;
      border: 1px solid transparent; border-bottom: none;
      transition: background .12s, color .12s;
    }
    .page-tab:hover  { background: #f3f4f6; color: #374151; }
    .page-tab.active { background: #eff6ff; color: #4f8ef7;
                       border-color: #dbeafe; }
    .page-tab.add-tab { color: #9ca3af; font-size: 18px; padding: 2px 10px; }
    .page-tab.add-tab:hover { color: #4f8ef7; background: #eff6ff; }
    .tab-delete {
      font-size: 14px; color: #9ca3af; padding: 0 2px;
      border-radius: 4px;
    }
    .tab-delete:hover { color: #dc2626; background: #fee2e2; }
    .page-tab-icon { font-size: 12px; }
    .page-tab-label { cursor: text; }
    .page-tab-rename-input {
      width: 80px; font-size: 13px; font-weight: 500;
      border: 1px solid #a5b4fc; border-radius: 4px;
      padding: 1px 4px; outline: none; background: #fff; color: #1a1a2e;
    }
    .add-page-menu {
      position: absolute; bottom: calc(100% + 6px); left: 0;
      background: #fff; border-radius: 10px; padding: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,.14); z-index: 200;
      min-width: 120px;
    }
    .add-page-item {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 8px 10px; border-radius: 7px;
      font-size: 13px; font-weight: 500; color: #374151;
      cursor: pointer; transition: background .12s;
    }
    .add-page-item:hover { background: #f3f4f6; }
    .add-page-icon { font-size: 16px; }

    /* ── MindMap ──────────────────────────────────────────────────────────── */
    .mm-node {
      position: absolute; border: 2px solid #d1d5db; border-radius: 8px;
      padding: 8px 12px; min-width: 80px; min-height: 50px;
      box-sizing: border-box;
      cursor: grab; user-select: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      transition: box-shadow .12s;
    }
    .mm-node:active { cursor: grabbing; }
    .mm-node.selected { box-shadow: 0 0 0 2.5px #6366f1, 0 2px 8px rgba(0,0,0,.15); }
    .mm-node-text { font-size: 14px; font-weight: 500; text-align: center; word-break: break-word; }
    .mm-node-edit {
      border: none; outline: none; background: transparent; resize: none;
      text-align: center; font-size: 14px; font-weight: 500;
      width: 100%; min-height: 24px; font-family: inherit;
    }
    .mm-port {
      position: absolute; width: 12px; height: 12px; border-radius: 50%;
      background: #6366f1; border: 2px solid #fff;
      opacity: 0; transition: opacity .15s; cursor: crosshair; z-index: 5;
    }
    .mm-node:hover .mm-port, .mm-node.selected .mm-port { opacity: 1; }
    .mm-port-top    { top: -8px;  left: 50%; transform: translateX(-50%); }
    .mm-port-right  { right: -8px; top: 50%; transform: translateY(-50%); }
    .mm-port-bottom { bottom: -8px; left: 50%; transform: translateX(-50%); }
    .mm-port-left   { left: -8px;  top: 50%; transform: translateY(-50%); }
    .mm-connecting .mm-port { opacity: 1; }
    .mm-node-toolbar {
      position: absolute; display: flex; align-items: center; gap: 3px;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 4px 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,.14); z-index: 20; pointer-events: auto;
    }
    .mm-color-btn {
      width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; flex-shrink: 0; padding: 0;
    }
    .mm-color-btn.active { border-color: #6366f1 !important; }
    .mm-delete-btn {
      width: 20px; height: 20px; border-radius: 4px; border: none;
      background: #fee2e2; color: #ef4444; cursor: pointer;
      font-size: 11px; display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .mm-delete-btn:hover { background: #fecaca; }
    .mm-conn-delete-btn {
      width: 22px; height: 22px; border-radius: 50%;
      background: #ef4444; color: #fff; border: 2px solid #fff;
      font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0;
      box-shadow: 0 1px 6px rgba(0,0,0,.3);
    }
    .mm-conn-delete-btn:hover { background: #dc2626; }

    /* ── Sticky notes ─────────────────────────────────────────────────────── */
    .sticky-note {
      position: absolute; border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,.18), 0 1px 4px rgba(0,0,0,.1);
      display: flex; flex-direction: column;
      overflow: visible; z-index: 50;
      min-width: 120px; min-height: 80px;
    }
    .sticky-handle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 6px; height: 22px; cursor: grab;
      background: rgba(0,0,0,0.12);
      user-select: none; flex-shrink: 0;
      touch-action: none;
    }
    .sticky-handle:active { cursor: grabbing; }
    .sticky-dots { font-size: 13px; color: rgba(0,0,0,.35); }
    .sticky-menu-btn {
      font-size: 15px; color: rgba(0,0,0,.5); padding: 1px 4px;
      border-radius: 4px; line-height: 1;
    }
    .sticky-menu-btn:hover { background: rgba(0,0,0,.12); }
    .sticky-menu {
      position: absolute; right: 0; top: 24px;
      background: #fff; border-radius: 10px; padding: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.15); z-index: 200; min-width: 150px;
    }
    .sticky-menu-label { font-size: 11px; color: #9ca3af; margin-bottom: 8px; }
    .sticky-colors { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .sticky-action-btn {
      width: 100%; text-align: left; font-size: 13px; color: #374151;
      padding: 6px 8px; border-radius: 6px; transition: background .12s;
      margin-bottom: 2px;
    }
    .sticky-action-btn:hover { background: #f3f4f6; }
    .sticky-delete-btn {
      width: 100%; text-align: left; font-size: 13px; color: #dc2626;
      padding: 6px 8px; border-radius: 6px; transition: background .12s;
    }
    .sticky-delete-btn:hover { background: #fee2e2; }
    .sticky-canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border-radius: 0 0 6px 6px;
    }
    .sticky-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .sticky-canvas-base { z-index: 0; }
    .sticky-canvas-overlay { z-index: 1; }
    .sticky-resize {
      position: absolute; bottom: 2px; right: 4px;
      font-size: 14px; color: rgba(0,0,0,.3); cursor: se-resize;
      user-select: none; line-height: 1; z-index: 1;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="js/app.js"></script>

  <script>
    const isLocalhost = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        if (isLocalhost) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
          return;
        }
        navigator.serviceWorker.register("sw.js").catch(console.warn);
      });
    }
  </script>
</body>
</html>
