<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#4f8ef7" />
  <title>OmniNote</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    /* ── Reset & Base ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", "PingFang TC", "Hiragino Sans", sans-serif; }
    button { cursor: pointer; border: none; background: none; font: inherit; }
    input, textarea { font: inherit; }

    /* ── App Shell ────────────────────────────────────────────────────────── */
    #app { height: 100%; }
    .app { height: 100%; display: flex; flex-direction: column; background: #f5f5f7; }

    /* ── Notebook List ────────────────────────────────────────────────────── */
    .notebook-list {
      flex: 1; overflow-y: auto; padding: 24px;
      max-width: 960px; margin: 0 auto; width: 100%;
    }
    /* ── Auth page ── */
    .auth-page {
      min-height: 100vh; background: #f0f4ff;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: #fff; border-radius: 18px; padding: 36px 40px;
      width: 100%; max-width: 400px;
      box-shadow: 0 8px 40px rgba(37,99,235,.13);
    }
    .auth-logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 28px;
    }
    .auth-logo-name { font-size: 22px; font-weight: 800; color: #1a1a2e; }
    .auth-form { display: flex; flex-direction: column; gap: 14px; }
    .auth-title { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 2px; }
    .auth-hint  { font-size: 13px; color: #6b7280; margin-top: -6px; }
    .auth-field { display: flex; flex-direction: column; gap: 5px; }
    .auth-label { font-size: 13px; font-weight: 600; color: #374151; }
    .auth-input {
      border: 1.5px solid #e5e7eb; border-radius: 9px;
      padding: 9px 12px; font-size: 14px; color: #1a1a2e;
      transition: border-color .15s; outline: none;
      font-family: inherit; width: 100%;
    }
    .auth-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
    .auth-textarea { resize: none; }
    .auth-btn {
      background: #2563eb; color: #fff; border-radius: 10px;
      padding: 11px; font-size: 15px; font-weight: 700;
      margin-top: 4px; transition: background .15s;
      cursor: pointer;
    }
    .auth-btn:hover:not(:disabled) { background: #1d4ed8; }
    .auth-btn:disabled { opacity: .55; cursor: not-allowed; }
    .auth-links { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6b7280; flex-wrap: wrap; }
    .auth-link-sep { color: #d1d5db; }
    .auth-link {
      color: #2563eb; font-weight: 600; font-size: 13px;
      background: none; border: none; cursor: pointer; padding: 0;
      text-decoration: none;
    }
    .auth-link:hover { text-decoration: underline; }
    .auth-error {
      background: #fef2f2; border: 1px solid #fecaca;
      color: #b91c1c; border-radius: 8px;
      padding: 9px 12px; font-size: 13px;
    }
    .auth-ok {
      background: #f0fdf4; border: 1px solid #bbf7d0;
      color: #166534; border-radius: 8px;
      padding: 9px 12px; font-size: 13px;
    }
    .auth-divider {
      display: flex; align-items: center; gap: 10px; margin: 4px 0;
    }
    .auth-divider-line { flex: 1; height: 1px; background: #e5e7eb; }
    .auth-divider-text { font-size: 12px; color: #9ca3af; }
    .auth-btn-guest {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 10px;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      background: #fff; color: #374151;
      font-size: 14px; font-weight: 600;
      transition: background .15s, border-color .15s;
      cursor: pointer;
    }
    .auth-btn-guest:hover { background: #f9fafb; border-color: #d1d5db; }

    /* ── WS Admin page ── */
    .ws-admin { flex: 1; min-height: 0; overflow-y: auto; background: #f0f4ff; display: flex; flex-direction: column; }
    .ws-admin .list-topbar { position: sticky; top: 0; z-index: 10; flex-shrink: 0; }
    .ws-body { padding: 24px; max-width: 820px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
    .ws-back-btn { display: flex; align-items: center; color: rgba(255,255,255,.75); margin-right: 4px; transition: color .15s; }
    .ws-back-btn:hover { color: #fff; }
    .ws-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #374151; transition: background .3s; }
    .ws-status-dot.online { background: #22c55e; }
    .ws-status-label { font-size: 13px; color: rgba(255,255,255,.75); }
    .ws-section { background: #fff; border-radius: 14px; padding: 22px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    .ws-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .ws-section-title { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .ws-section-hint { font-size: 13px; color: #6b7280; margin-bottom: 14px; line-height: 1.5; }
    .ws-badge { background: #2563eb; color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
    .ws-origin-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; min-height: 20px; }
    .ws-origin-empty { font-size: 13px; color: #9ca3af; font-style: italic; }
    .ws-origin-row { display: flex; align-items: center; justify-content: space-between; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 12px; }
    .ws-origin-url { font-size: 13px; color: #374151; font-family: monospace; word-break: break-all; }
    .ws-origin-remove { color: #9ca3af; font-size: 18px; line-height: 1; padding: 0 4px; transition: color .15s; flex-shrink: 0; }
    .ws-origin-remove:hover { color: #ef4444; }
    .ws-origin-add { display: flex; gap: 8px; margin-bottom: 14px; }
    .ws-origin-input { flex: 1; border: 1.5px solid #e5e7eb; border-radius: 9px; padding: 8px 12px; font-size: 13px; outline: none; }
    .ws-origin-input:focus { border-color: #2563eb; }
    .ws-btn-add { background: #eff6ff; color: #2563eb; border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .ws-btn-save { background: #2563eb; color: #fff; border-radius: 10px; padding: 9px 20px; font-size: 14px; font-weight: 700; transition: background .15s; }
    .ws-btn-save:hover:not(:disabled) { background: #1d4ed8; }
    .ws-btn-save:disabled { opacity: .55; cursor: not-allowed; }
    .ws-btn-refresh { display: flex; align-items: center; gap: 5px; background: #f3f4f6; color: #374151; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; transition: background .15s; }
    .ws-btn-refresh:hover:not(:disabled) { background: #e5e7eb; }
    .ws-room-empty { font-size: 13px; color: #9ca3af; font-style: italic; padding: 8px 0; }
    .ws-room-grid { display: flex; flex-direction: column; gap: 10px; }
    .ws-room-card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
    .ws-room-id { font-family: monospace; font-size: 12px; color: #9ca3af; }
    .ws-room-users { display: flex; gap: 6px; flex-wrap: wrap; }
    .ws-chip { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .ws-chip.blue { background: #dbeafe; color: #1d4ed8; }
    .ws-chip.gray { background: #f3f4f6; color: #9ca3af; }
    .ws-room-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b7280; flex-wrap: wrap; }
    .ws-dot { color: #d1d5db; }
    .ws-expiry-warn { color: #f59e0b; font-weight: 600; }
    .ws-code-wrap { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    .ws-code-toolbar { display: flex; align-items: center; justify-content: space-between; background: #f9fafb; padding: 8px 14px; border-bottom: 1px solid #e5e7eb; }
    .ws-code-lang { font-size: 12px; font-weight: 600; color: #6b7280; }
    .ws-copy-btn { background: #eff6ff; color: #2563eb; border-radius: 6px; padding: 4px 12px; font-size: 12px; font-weight: 600; transition: background .15s; }
    .ws-copy-btn:hover { background: #dbeafe; }
    .ws-code { margin: 0; padding: 18px; font-size: 12px; line-height: 1.65; overflow-x: auto; color: #1a1a2e; background: #fff; white-space: pre; }
    .ws-inline-code { background: #f3f4f6; padding: 1px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }

    /* ── Top bar (notebook list) ── */
    .list-topbar {
      display: flex; align-items: center; justify-content: space-between;
      background: #1a1a2e; padding: 0 20px; height: 54px;
      position: sticky; top: 0; z-index: 10;
      margin: -24px -24px 28px;        /* bleed to edges of notebook-list padding */
    }
    .list-topbar-brand {
      display: flex; align-items: center; gap: 9px;
      flex-shrink: 0;
    }
    .list-topbar-name {
      font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -.3px;
    }
    .list-topbar-right { display: flex; align-items: center; gap: 10px; }
    .list-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #2563eb; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      flex-shrink: 0;
    }
    .list-signout-btn {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 8px;
      color: rgba(255,255,255,.65);
      transition: background .15s, color .15s;
    }
    .list-signout-btn:hover { background: rgba(255,255,255,.12); color: #fff; }

    /* ── List body ── */
    .list-body { display: flex; flex-direction: column; gap: 20px; }
    .list-section-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .list-section-title { font-size: 16px; font-weight: 700; color: #374151; }
    .btn-primary {
      background: #4f8ef7; color: #fff; border-radius: 10px;
      padding: 9px 18px; font-size: 14px; font-weight: 600;
      transition: background .15s;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary {
      background: #e5e7eb; color: #374151; border-radius: 10px;
      padding: 9px 18px; font-size: 14px; font-weight: 600;
    }
    .create-form {
      background: #fff; border-radius: 14px; padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .input-field {
      border: 1.5px solid #d1d5db; border-radius: 8px;
      padding: 10px 14px; font-size: 15px; outline: none; width: 100%;
      transition: border-color .15s;
    }
    .input-field:focus { border-color: #4f8ef7; }
    .form-actions { display: flex; gap: 10px; }
    .empty-state {
      text-align: center; padding: 80px 20px; color: #9ca3af;
    }
    .empty-icon { font-size: 64px; margin-bottom: 16px; }
    .notebooks-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px;
    }
    .notebook-card {
      background: #fff; border-radius: 14px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      transition: transform .15s, box-shadow .15s;
    }
    .notebook-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
    .card-body { padding: 18px 18px 8px; cursor: pointer; }
    .card-title { font-size: 16px; font-weight: 600; color: #1a1a2e; margin-bottom: 8px; }
    .card-meta { display: flex; gap: 6px; font-size: 12px; color: #9ca3af; }
    .card-actions {
      display: flex; justify-content: flex-end; gap: 4px;
      padding: 8px 12px 12px; border-top: 1px solid #f3f4f6;
    }
    .icon-btn {
      width: 32px; height: 32px; padding: 0;
      border-radius: 6px; font-size: 13px;
      color: #4b5563; background: transparent;
      border: 1px solid #e5e7eb;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s, color .15s;
    }
    .icon-btn:hover {
      background: #f9fafb; border-color: #d1d5db; color: #1f2937;
    }
    .icon-btn.danger:hover { background: #fff1f2; border-color: #fecdd3; color: #dc2626; }

    /* ── Editor Layout ────────────────────────────────────────────────────── */
    .app.editor { display: flex; flex-direction: column; }
    .top-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 0 10px; min-height: 48px; background: #fff;
      border-bottom: 1px solid #e5e7eb; flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
      overflow: visible;
    }
    .top-bar-leading {
      display: flex; align-items: center; gap: 8px;
      min-width: 0; flex: 0 1 auto;
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: #2563eb; font-size: 13px; font-weight: 600;
      padding: 4px 8px; border-radius: 6px; transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .btn-back:hover { background: #eff6ff; }
    .btn-back-icon { flex-shrink: 0; }
    .btn-back-label { white-space: nowrap; }
    .notebook-title {
      flex: 0 1 200px; font-size: 15px; font-weight: 600;
      color: #1a1a2e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .top-bar-tools {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
    }
    .top-bar-actions {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .save-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 32px;
      padding: 0;
    }
    .save-status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 0 0 3px rgba(209,213,219,.85);
    }
    .save-status-dot.saving { background: #f59e0b; }
    .save-status-dot.saved  { background: #10b981; }

    /* ── Export menu ──────────────────────────────────────────────────────── */
    /* ── Background picker ────────────────────────────────────────────────── */
    .bg-menu-wrap { position: relative; }
    .bg-dropdown {
      position: absolute; right: 0; top: calc(100% + 6px);
      background: #fff; border-radius: 14px; padding: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.14); z-index: 150;
      min-width: 220px; display: flex; flex-direction: column; gap: 10px;
    }
    .bg-section-label { font-size: 11px; font-weight: 600; color: #9ca3af; }
    .bg-type-row { display: flex; gap: 4px; }
    .bg-type-btn {
      flex: 1; padding: 6px 4px; font-size: 12px; font-weight: 600;
      border-radius: 8px; border: 1.5px solid #e5e7eb;
      color: #374151; background: #f9fafb; transition: all .12s;
    }
    .bg-type-btn:hover { background: #f3f4f6; border-color: #d1d5db; }
    .bg-type-btn.active { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
    .bg-sliders { display: flex; flex-direction: column; gap: 8px; }
    .bg-slider-row {
      display: flex; align-items: center; gap: 8px;
    }
    .bg-slider-label { font-size: 11px; color: #6b7280; width: 40px; flex-shrink: 0; }
    .bg-slider-row input[type=range] { flex: 1; }
    .bg-slider-value { font-size: 11px; color: #374151; width: 36px; text-align: right; flex-shrink: 0; }
    .bg-divider { height: 1px; background: #f3f4f6; margin: 2px 0; }
    .bg-upload-btn {
      width: 100%; padding: 8px; font-size: 13px; font-weight: 600;
      border-radius: 8px; border: 1.5px dashed #d1d5db;
      color: #4b5563; background: #f9fafb; transition: all .12s;
    }
    .bg-upload-btn:hover { background: #f3f4f6; border-color: #9ca3af; }
    .bg-remove-btn {
      width: 100%; padding: 7px; font-size: 12px; font-weight: 600;
      border-radius: 8px; color: #dc2626; background: #fff1f2;
      border: 1px solid #fecdd3; transition: background .12s;
    }
    .bg-remove-btn:hover { background: #fee2e2; }

    .export-menu-wrap { position: relative; }
    .btn-export {
      background: #f3f4f6; color: #374151; border-radius: 8px;
      padding: 7px 14px; font-size: 13px; font-weight: 600;
      transition: background .15s; white-space: nowrap;
    }
    .btn-export:hover:not(:disabled) { background: #e5e7eb; }
    .btn-export:disabled { opacity: .6; cursor: not-allowed; }
    .export-backdrop {
      position: fixed; inset: 0; z-index: 149;
    }
    .export-dropdown {
      position: absolute; right: 0; top: calc(100% + 6px);
      background: #fff; border-radius: 12px; padding: 6px;
      box-shadow: 0 8px 28px rgba(0,0,0,.14); z-index: 150;
      min-width: 220px;
    }
    .export-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%; text-align: left; padding: 10px 12px;
      border-radius: 8px; transition: background .12s;
    }
    .export-item:hover { background: #f3f4f6; }
    .export-icon { font-size: 22px; flex-shrink: 0; }
    .export-label { font-size: 14px; font-weight: 600; color: #1a1a2e; }
    .export-hint  { font-size: 11px; color: #9ca3af; margin-top: 1px; }
    .export-bg-toggle {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; cursor: pointer;
      font-size: 13px; color: #374151; user-select: none;
    }
    .export-bg-toggle input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: #6366f1; }
    .export-divider { height: 1px; background: #e5e7eb; margin: 4px 8px; }

    /* ── PDF Import Modal ─────────────────────────────────────────────────── */
    .cloud-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .cloud-modal-title { font-size: 17px; font-weight: 700; color: #1a1a2e; }
    .cloud-modal-close {
      margin-left: auto;
      background: none; border: none; font-size: 18px; color: #6b7280;
      cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1;
    }
    .cloud-modal-close:hover { background: #f3f4f6; color: #374151; }
    .cloud-modal-footer {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 10px; flex-shrink: 0; padding-top: 4px;
    }
    .cloud-btn-cancel {
      background: #f3f4f6; color: #374151; border: none;
      border-radius: 8px; padding: 9px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .cloud-btn-cancel:hover { background: #e5e7eb; }
    .cloud-btn-primary {
      background: #6366f1; color: #fff; border: none;
      border-radius: 8px; padding: 9px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .cloud-btn-primary:hover:not(:disabled) { background: #4f46e5; }
    .cloud-btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .cloud-error { color: #dc2626; font-size: 13px; margin: 0; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
    }
    .pdf-modal {
      background: #fff; border-radius: 16px; padding: 24px;
      width: 780px; max-width: 95vw; max-height: 92vh;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      display: flex; flex-direction: column; gap: 16px; overflow: hidden;
    }
    .pdf-drop-area {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; border: 2px dashed #d1d5db; border-radius: 12px; padding: 48px 24px;
    }
    .pdf-drop-hint { font-size: 14px; color: #6b7280; }
    .pdf-pick-btn {
      background: #6366f1; color: #fff; border: none;
      border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .pdf-pick-btn:hover { background: #4f46e5; }
    .pdf-status-center {
      display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px;
    }
    .pdf-spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid #e5e7eb; border-top-color: #6366f1;
      animation: pdf-spin .7s linear infinite;
    }
    @keyframes pdf-spin { to { transform: rotate(360deg); } }
    .pdf-thumb-section { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .pdf-thumb-bar {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; color: #374151; flex-shrink: 0;
    }
    .pdf-thumb-bar-hint { color: #6b7280; }
    .pdf-select-all-btn {
      background: #f3f4f6; color: #374151; border: none;
      border-radius: 6px; padding: 5px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .pdf-select-all-btn:hover { background: #e5e7eb; }
    .pdf-thumb-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px; overflow-y: auto; padding-right: 4px;
    }
    .pdf-thumb-item {
      position: relative; border: 2.5px solid #e5e7eb; border-radius: 8px;
      overflow: hidden; cursor: pointer; background: #f9fafb;
      transition: border-color .15s;
    }
    .pdf-thumb-item:hover    { border-color: #a5b4fc; }
    .pdf-thumb-item.selected { border-color: #6366f1; }
    .pdf-thumb-img { width: 100%; height: auto; display: block; }
    .pdf-thumb-num {
      position: absolute; bottom: 4px; left: 6px;
      font-size: 11px; color: #6b7280;
      background: rgba(255,255,255,.85); border-radius: 4px; padding: 1px 5px;
    }
    .pdf-check-circle {
      position: absolute; top: 5px; right: 5px;
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid #d1d5db; background: rgba(255,255,255,.9);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
    }
    .pdf-thumb-item.selected .pdf-check-circle {
      background: #6366f1; border-color: #6366f1;
    }
    .pdf-progress-wrap { display: flex; flex-direction: column; gap: 10px; padding: 8px 0; }
    .pdf-progress-meta {
      display: flex; justify-content: space-between;
      font-size: 13px; color: #374151;
    }
    .pdf-progress-track {
      height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden;
    }
    .pdf-progress-fill {
      height: 100%; background: #6366f1; border-radius: 4px;
      transition: width .25s ease;
    }

    .editor-main {
      flex: 1; display: flex; overflow: hidden;
    }

    /* ── Canvas wrapper (positioned) ──────────────────────────────────────── */
    .canvas-wrapper {
      flex: 1; position: relative; overflow: auto;
      background: #e8eaed;
      scrollbar-gutter: stable;
    }
    .canvas-wrapper.is-pan-mode {
      cursor: grab;
    }
    .page-stage {
      min-width: 100%; min-height: 100%;
      display: flex; justify-content: safe center;
      align-items: flex-start;
      padding: 28px;
    }
    .page-zoom-layer {
      position: relative;
      flex: 0 0 auto;
    }
    .page-content {
      position: relative;
      transform-origin: top left;
      background: #fff;
      border: 1px solid #d9dde5;
      box-shadow: 0 12px 36px rgba(16, 24, 40, .18), 0 2px 8px rgba(16, 24, 40, .08);
    }

    /* ── Toolbar ──────────────────────────────────────────────────────────── */
    .toolbar {
      display: flex; flex-direction: row; align-items: center;
      gap: 1px; padding: 0 2px;
      background: transparent;
      overflow: visible;
      height: 48px;
      width: max-content;
    }
    .tool-btn {
      width: 34px; height: 34px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: #4b5563; transition: background .12s, color .12s, border-color .12s;
      border: 1px solid transparent;
    }
    .tool-btn:hover  { background: #f9fafb; border-color: #e5e7eb; color: #1f2937; }
    .tool-btn.active { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
    .tool-btn.danger:hover { background: #fff1f2; border-color: #fecdd3; color: #dc2626; }
    .tool-divider { width: 1px; height: 22px; background: #e5e7eb; margin: 0 3px; }

    .color-swatch-btn {
      --swatch-dot-size: 18px;
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid #d1d5db;
      box-shadow: none; cursor: pointer;
      transition: transform .1s;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
    }
    .color-swatch-dot {
      width: var(--swatch-dot-size);
      height: var(--swatch-dot-size);
      border-radius: 50%;
      transition: width .15s, height .15s;
    }
    .color-swatch-btn:hover { transform: scale(1.15); }
    .color-palette {
      background: #fff; border-radius: 12px;
        padding: 10px; display: flex; flex-direction: row; flex-wrap: wrap;
        gap: 6px; max-width: 160px;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
    }
    .color-palette-overlay {
      position: fixed; z-index: 120;
    }
    .color-dot {
      width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid transparent;
      cursor: pointer; transition: transform .1s, border-color .1s;
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.selected { border-color: #1a1a2e; }

    .eraser-mode-toggle {
      font-size: 9px; font-weight: 700; border-radius: 4px;
      padding: 1px 3px; margin-left: -4px; margin-top: -2px;
      align-self: flex-end;
    }
    .mode-badge.precise { background: #dbeafe; color: #1d4ed8; }
    .mode-badge.stroke  { background: #fce7f3; color: #be185d; }

    /* ── Width swatch button (next to color swatch) ──────────────────────── */
    .width-swatch-btn {
      width: 28px; height: 28px; border-radius: 6px;
      border: 1.5px solid #d1d5db; background: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: border-color .12s, background .12s;
      flex-shrink: 0;
    }
    .width-swatch-btn:hover { background: #f9fafb; border-color: #9ca3af; }
    .width-swatch-btn.active { background: #eff6ff; border-color: #bfdbfe; }
    .width-swatch-line {
      display: block; width: 14px; border-radius: 99px;
      min-height: 2px;
    }
    .width-popover input[type=range]::-webkit-slider-thumb {
      appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: #4f8ef7; cursor: pointer;
    }
    .width-value {
      font-size: 12px; font-weight: 600; color: #374151;
      min-width: 22px; text-align: right;
    }

    /* Toolbar resize grip */
    .toolbar-grip {
      width: 100%; height: 32px; flex-shrink: 0; margin-top: 4px;
      display: flex; align-items: center; justify-content: center;
      cursor: ew-resize; border-top: 1px solid #f0f0f0; user-select: none;
    }
    .toolbar-grip:hover { background: #f9fafb; }

    /* ── Width popover (fixed overlay) ───────────────────────────────────── */
    .width-popover-overlay {
      position: fixed; z-index: 200;
      background: #fff; border-radius: 12px;
      padding: 12px 14px; min-width: 180px;
      box-shadow: 0 8px 28px rgba(0,0,0,.15);
      display: flex; flex-direction: column; gap: 8px;
    }
    .width-popover-label { font-size: 11px; color: #6b7280; font-weight: 600; }
    .width-popover-value { font-size: 12px; color: #374151; text-align: right; }
    .width-slider-wrap {
      position: relative; display: flex; align-items: center;
      justify-content: center; width: 150px; height: 32px;
    }
    .width-triangle {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 148px; height: 18px;
      background: linear-gradient(to right, #e0e0e0 0%, #9ca3af 100%);
      clip-path: polygon(0% 35%, 0% 65%, 100% 0%, 100% 100%);
      pointer-events: none;
      border-radius: 0 3px 3px 0;
      opacity: 0.55;
    }
    .width-slider-wrap input[type=range] {
      position: relative; z-index: 1;
      width: 150px; appearance: none;
      writing-mode: horizontal-tb; direction: ltr;
      height: 24px; background: transparent;
    }
    /* ── Zoom dropdown ────────────────────────────────────────────────────── */
    .zoom-menu-wrap { position: relative; }
    .zoom-dropdown {
      position: absolute; right: 0; top: calc(100% + 6px);
      background: #fff; border-radius: 12px; padding: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,.14); z-index: 150;
      min-width: 220px;
    }
    .zoom-slider-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 6px; margin-bottom: 10px;
    }
    .zoom-slider-value {
      font-size: 18px; font-weight: 700; color: #111827;
    }
    .zoom-reset {
      padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      color: #2563eb; background: #eff6ff;
    }
    .zoom-slider {
      width: 100%;
      accent-color: #2563eb;
    }
    .zoom-slider-scale {
      display: flex; justify-content: space-between; margin-top: 8px;
      font-size: 11px; color: #6b7280;
    }

    @media (max-width: 820px) {
      .top-bar {
        flex-wrap: wrap;
        align-content: flex-start;
        padding: 8px 10px 6px;
        gap: 6px;
      }
      .top-bar-leading {
        flex: 1 1 auto;
        min-width: 0;
      }
      .btn-back-label {
        display: none;
      }
      .notebook-title {
        flex: 1 1 auto;
      }
      .top-bar-actions {
        margin-left: 0;
      }
      .top-bar-tools {
        order: 3;
        flex: 1 0 100%;
        width: 100%;
        padding-bottom: 2px;
      }
    }

    @media (max-width: 560px) {
      .top-bar-leading {
        flex: 1 1 0;
      }
      .notebook-title {
        max-width: 42vw;
      }
      .top-bar-actions {
        gap: 6px;
      }
      .zoom-dropdown {
        right: -10px;
        min-width: min(240px, calc(100vw - 20px));
      }
    }


    /* ── Page tabs ────────────────────────────────────────────────────────── */
    .page-tabs {
      display: flex; align-items: center;
      padding: 0 12px; height: 44px; background: #fff;
      border-top: 1px solid #e5e7eb; flex-shrink: 0;
      overflow: visible;
    }
    .page-tabs-scroll {
      display: flex; align-items: center; gap: 2px;
      overflow-x: auto; flex: 1;
    }
    .page-tabs-add-wrap {
      position: relative; flex-shrink: 0;
    }
    .page-tab {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 14px; border-radius: 8px 8px 0 0;
      font-size: 13px; font-weight: 500; color: #6b7280;
      cursor: pointer; white-space: nowrap;
      border: 1px solid transparent; border-bottom: none;
      transition: background .12s, color .12s;
    }
    .page-tab:hover  { background: #f3f4f6; color: #374151; }
    .page-tab.active { background: #eff6ff; color: #4f8ef7;
                       border-color: #dbeafe; }
    .page-tab.add-tab { color: #9ca3af; font-size: 18px; padding: 2px 10px; }
    .page-tab.add-tab:hover { color: #4f8ef7; background: #eff6ff; }
    .tab-delete {
      font-size: 14px; color: #9ca3af; padding: 0 2px;
      border-radius: 4px;
    }
    .tab-delete:hover { color: #dc2626; background: #fee2e2; }
    .page-tab-icon { font-size: 12px; }
    .page-tab-label { cursor: text; }
    .page-tab-rename-input {
      width: 80px; font-size: 13px; font-weight: 500;
      border: 1px solid #a5b4fc; border-radius: 4px;
      padding: 1px 4px; outline: none; background: #fff; color: #1a1a2e;
    }
    .add-page-menu {
      position: absolute; bottom: calc(100% + 6px); left: 0;
      background: #fff; border-radius: 10px; padding: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,.14); z-index: 200;
      min-width: 120px;
    }
    .add-page-item {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 8px 10px; border-radius: 7px;
      font-size: 13px; font-weight: 500; color: #374151;
      cursor: pointer; transition: background .12s;
    }
    .add-page-item:hover { background: #f3f4f6; }
    .add-page-icon { font-size: 16px; }

    /* ── MindMap ──────────────────────────────────────────────────────────── */
    .mm-node {
      position: absolute; border: 2px solid #d1d5db; border-radius: 8px;
      padding: 8px 12px; min-width: 80px; min-height: 50px;
      box-sizing: border-box;
      cursor: grab; user-select: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      transition: box-shadow .12s;
    }
    .mm-node:active { cursor: grabbing; }
    .mm-node.selected { box-shadow: 0 0 0 2.5px #6366f1, 0 2px 8px rgba(0,0,0,.15); }
    .mm-node-text { font-size: 14px; font-weight: 500; text-align: center; word-break: break-word; }
    .mm-node-edit {
      border: none; outline: none; background: transparent; resize: none;
      text-align: center; font-size: 14px; font-weight: 500;
      width: 100%; min-height: 24px; font-family: inherit;
    }
    .mm-port {
      position: absolute; width: 12px; height: 12px; border-radius: 50%;
      background: #6366f1; border: 2px solid #fff;
      opacity: 0; transition: opacity .15s; cursor: crosshair; z-index: 5;
    }
    .mm-node:hover .mm-port, .mm-node.selected .mm-port { opacity: 1; }
    .mm-port-top    { top: -8px;  left: 50%; transform: translateX(-50%); }
    .mm-port-right  { right: -8px; top: 50%; transform: translateY(-50%); }
    .mm-port-bottom { bottom: -8px; left: 50%; transform: translateX(-50%); }
    .mm-port-left   { left: -8px;  top: 50%; transform: translateY(-50%); }
    .mm-connecting .mm-port { opacity: 1; }
    .mm-node-toolbar {
      position: absolute; display: flex; align-items: center; gap: 3px;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 4px 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,.14); z-index: 20; pointer-events: auto;
    }
    .mm-color-btn {
      width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; flex-shrink: 0; padding: 0;
    }
    .mm-color-btn.active { border-color: #6366f1 !important; }
    .mm-delete-btn {
      width: 20px; height: 20px; border-radius: 4px; border: none;
      background: #fee2e2; color: #ef4444; cursor: pointer;
      font-size: 11px; display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .mm-delete-btn:hover { background: #fecaca; }
    .mm-conn-delete-btn {
      width: 22px; height: 22px; border-radius: 50%;
      background: #ef4444; color: #fff; border: 2px solid #fff;
      font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0;
      box-shadow: 0 1px 6px rgba(0,0,0,.3);
    }
    .mm-conn-delete-btn:hover { background: #dc2626; }

    /* ── Sticky notes ─────────────────────────────────────────────────────── */
    .sticky-note {
      position: absolute; border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,.18), 0 1px 4px rgba(0,0,0,.1);
      display: flex; flex-direction: column;
      overflow: visible; z-index: 50;
      min-width: 120px; min-height: 80px;
    }
    .sticky-handle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 6px; height: 22px; cursor: grab;
      background: rgba(0,0,0,0.12);
      user-select: none; flex-shrink: 0;
      touch-action: none;
    }
    .sticky-handle:active { cursor: grabbing; }
    .sticky-dots { font-size: 13px; color: rgba(0,0,0,.35); }
    .sticky-menu-btn {
      font-size: 15px; color: rgba(0,0,0,.5); padding: 1px 4px;
      border-radius: 4px; line-height: 1;
    }
    .sticky-menu-btn:hover { background: rgba(0,0,0,.12); }
    .sticky-menu {
      position: absolute; right: 0; top: 24px;
      background: #fff; border-radius: 10px; padding: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.15); z-index: 200; min-width: 150px;
    }
    .sticky-menu-label { font-size: 11px; color: #9ca3af; margin-bottom: 8px; }
    .sticky-colors { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .sticky-action-btn {
      width: 100%; text-align: left; font-size: 13px; color: #374151;
      padding: 6px 8px; border-radius: 6px; transition: background .12s;
      margin-bottom: 2px;
    }
    .sticky-action-btn:hover { background: #f3f4f6; }
    .sticky-delete-btn {
      width: 100%; text-align: left; font-size: 13px; color: #dc2626;
      padding: 6px 8px; border-radius: 6px; transition: background .12s;
    }
    .sticky-delete-btn:hover { background: #fee2e2; }
    .sticky-canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border-radius: 0 0 6px 6px;
    }
    .sticky-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .sticky-canvas-base { z-index: 0; }
    .sticky-canvas-overlay { z-index: 1; }
    .sticky-resize {
      position: absolute; bottom: 2px; right: 4px;
      font-size: 14px; color: rgba(0,0,0,.3); cursor: se-resize;
      user-select: none; line-height: 1; z-index: 1;
      touch-action: none;
    }

    /* ── Canvas controls (zoom + background) ──────────────────────────────── */
    .canvas-controls {
      position: absolute; bottom: 12px; right: 12px;
      display: flex; align-items: center; gap: 3px;
      z-index: 50;
      background: rgba(255,255,255,0.92);
      border-radius: 10px; padding: 4px 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      backdrop-filter: blur(6px);
    }
    .cc-btn {
      min-width: 30px; height: 28px; border-radius: 6px;
      font-size: 13px; font-weight: 600; color: #374151;
      background: transparent; padding: 0 6px;
      transition: background .12s;
      display: flex; align-items: center; justify-content: center;
    }
    .cc-btn:hover:not(:disabled) { background: #f3f4f6; }
    .cc-btn:disabled { opacity: .35; cursor: not-allowed; }
    .cc-btn.active   { background: #eff6ff; color: #4f8ef7; }
    .cc-zoom-pct { min-width: 44px; font-variant-numeric: tabular-nums; }
    .cc-sep { width: 1px; height: 18px; background: #e5e7eb; margin: 0 2px; }
    .cc-bg-btn { gap: 4px; }

    /* Background picker dropdown */
    .bg-picker {
      position: absolute; bottom: calc(100% + 6px); right: 0;
      background: #fff; border-radius: 10px; padding: 5px;
      box-shadow: 0 4px 16px rgba(0,0,0,.14); z-index: 51;
      display: flex; flex-direction: column; gap: 2px; min-width: 76px;
    }
    .bg-opt {
      padding: 7px 12px; border-radius: 6px;
      font-size: 13px; text-align: left; width: 100%; color: #374151;
      transition: background .1s;
    }
    .bg-opt:hover  { background: #f3f4f6; }
    .bg-opt.active { background: #eff6ff; color: #4f8ef7; font-weight: 600; }
    .cc-backdrop   { position: fixed; inset: 0; z-index: 49; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="js/app.js"></script>

  <script>
    const isLocalhost = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        if (isLocalhost) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
          return;
        }
        navigator.serviceWorker.register("sw.js").catch(console.warn);
      });
    }
  </script>
</body>
</html>
